<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found | TronoPDF</title>
<meta name="description" content="The page you are looking for does not exist. Explore all free PDF tools at TronoPDF.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
 .nf-wrap{max-width:700px;margin:0 auto;text-align:center;padding:80px 20px}
 .nf-code{font-size:110px;font-weight:900;background:linear-gradient(135deg,#7c3aed,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
 .nf-wrap h1{font-size:26px;font-weight:900;color:#1e1e2e;margin:10px 0}
 .nf-wrap p{color:#7a7a85;font-size:15px;margin-bottom:26px}
 .nf-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
 .nf-actions a{padding:14px 26px;border-radius:12px;font-weight:800;font-size:14px;text-decoration:none}
 .nf-home{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}
 .nf-tools{background:#fff;border:2px solid #eceaf6;color:#4b4b5a}
 html[data-theme="dark"] body{background:#0f0f17}
 html[data-theme="dark"] .nf-wrap h1{color:#f4f4fa}
 html[data-theme="dark"] .nf-tools{background:#1b1b2b;border-color:#2a2a40;color:#e8e8f0}
</style>
</head>
<body>
<header id="siteHeader"></header>
<div class="nf-wrap">
  <div class="nf-code">404</div>
  <h1>Oops! Page not found</h1>
  <p>The page you are looking for doesn't exist or has been moved. Try one of these instead:</p>
  <div class="nf-actions">
    <a class="nf-home" href="/">Go to Homepage</a>
    <a class="nf-tools" href="/all-tools.html">Browse All Tools</a>
  </div>
</div>
<footer id="siteFooter"></footer>
<script src="/shared.js"></script>
</body>
</html>
